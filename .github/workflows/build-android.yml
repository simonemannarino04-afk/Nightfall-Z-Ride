name: Build Nightfall Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android toolchain
        shell: bash
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -keyalg RSA -keysize 2048

      - name: Install Godot 4.5.1
        shell: bash
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project
        shell: bash
        run: |
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path godot --import

      - name: Export APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path godot --export-debug Android "$GITHUB_WORKSPACE/build/Nightfall-Z-Ride.apk"
          test -s "$GITHUB_WORKSPACE/build/Nightfall-Z-Ride.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Z-Ride-Android
          path: build/Nightfall-Z-Ride.apk
          if-no-files-found: error
