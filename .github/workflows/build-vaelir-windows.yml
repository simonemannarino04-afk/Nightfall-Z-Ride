name: Build Vaelir Bloodbound Windows
on:
  push:
    branches: [vaelir-dark-fantasy-prototype]
    paths:
      - 'VaelirPrototype/**'
      - '.github/workflows/build-vaelir-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download real CC0 3D asset packs
        run: |
          set -e
          mkdir -p VaelirPrototype/assets/external/{characters,village,monsters}
          wget -q 'https://opengameart.org/sites/default/files/ultimate_animated_character_pack_by_quaternius.zip' -O /tmp/characters.zip
          wget -q 'https://opengameart.org/sites/default/files/medieval_village_pack_-_dec_2020.zip' -O /tmp/village.zip
          wget -q 'https://opengameart.org/sites/default/files/Animated%20Monster%20Pack%20by%20%40Quaternius.zip' -O /tmp/monsters.zip
          unzip -q /tmp/characters.zip -d VaelirPrototype/assets/external/characters
          unzip -q /tmp/village.zip -d VaelirPrototype/assets/external/village
          unzip -q /tmp/monsters.zip -d VaelirPrototype/assets/external/monsters
          echo '--- CHARACTER ASSETS ---'
          find VaelirPrototype/assets/external/characters -type f | head -80
          echo '--- VILLAGE ASSETS ---'
          find VaelirPrototype/assets/external/village -type f | head -80
          echo '--- MONSTER ASSETS ---'
          find VaelirPrototype/assets/external/monsters -type f | head -80

      - name: Download Godot 4.5.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q Godot_v4.5.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

      - name: Validate Vaelir project strictly
        run: |
          set -o pipefail
          ./Godot_v4.5.1-stable_linux.x86_64 --headless --path VaelirPrototype --editor --quit 2>&1 | tee validate.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" validate.log; then
            echo "Godot script validation failed"
            exit 1
          fi

      - name: Export Windows build strictly
        run: |
          set -o pipefail
          mkdir -p VaelirPrototype/build
          ./Godot_v4.5.1-stable_linux.x86_64 --headless --path VaelirPrototype --export-release "Windows Desktop" build/Vaelir-Bloodbound.exe 2>&1 | tee export.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Project export .* failed" export.log; then
            echo "Godot export reported errors"
            exit 1
          fi
          test -s VaelirPrototype/build/Vaelir-Bloodbound.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Vaelir-Bloodbound-Windows
          path: VaelirPrototype/build/
          if-no-files-found: error
