<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Nightfall Z Ride</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07090c;color:#eee;font-family:system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:800}.help{position:fixed;bottom:14px;left:14px;background:#0009;padding:10px 14px;border-radius:14px;font-size:13px}.fire{position:fixed;right:22px;bottom:24px;width:86px;height:86px;border-radius:50%;border:3px solid #fff8;background:#9e1b1bcc;color:white;font-size:30px;font-weight:bold}.title{position:fixed;top:45px;width:100%;text-align:center;font-size:14px;opacity:.75}</style></head><body><canvas id="g"></canvas><div class="hud"><span>❤️ MEZZO <b id="hp">100</b></span><span>💀 <b id="kills">0</b> &nbsp; 🔫 <b id="ammo">30</b></span></div><div class="title">NIGHTFALL Z RIDE — PROTOTIPO</div><div class="help">Trascina per mirare • premi FUOCO</div><button class="fire" id="fire">🔥</button><script>const c=document.getElementById('g'),x=c.getContext('2d');let W,H,aimX,aimY,hp=100,kills=0,ammo=30,z=[],shots=[],t=0,over=false;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;aimX=W/2;aimY=H/2}addEventListener('resize',resize);resize();function spawn(){z.push({x:Math.random()*W,y:-40,r:18+Math.random()*12,s:1+Math.random()*1.6,h:2})}function shoot(){if(over)return;if(ammo<=0){ammo=30;return}ammo--;shots.push({x:W/2,y:H*.7,tx:aimX,ty:aimY,l:8});for(let q of z){if(Math.hypot(q.x-aimX,q.y-aimY)<q.r+28){q.h--;if(q.h<=0){q.dead=1;kills++}break}}drawHud()}fire.onpointerdown=e=>{e.preventDefault();shoot()};c.onpointermove=e=>{if(e.buttons||e.pointerType==='touch'){aimX=e.clientX;aimY=e.clientY}};c.onpointerdown=e=>{aimX=e.clientX;aimY=e.clientY};function drawHud(){document.getElementById('hp').textContent=Math.max(0,hp);document.getElementById('kills').textContent=kills;document.getElementById('ammo').textContent=ammo}function loop(){x.clearRect(0,0,W,H);let grd=x.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#07101b');grd.addColorStop(1,'#18191b');x.fillStyle=grd;x.fillRect(0,0,W,H);x.fillStyle='#25282b';x.fillRect(W*.18,0,W*.64,H);x.strokeStyle='#b6a35a55';x.lineWidth=4;x.setLineDash([35,35]);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);x.fillStyle='#303840';x.fillRect(W/2-55,H*.68,110,145);x.fillStyle='#15191c';x.fillRect(W/2-42,H*.7,84,45);t++;if(t%55===0)spawn();for(let q of z){q.y+=q.s;q.x+=(W/2-q.x)*.0015;if(q.y>H*.7&&Math.abs(q.x-W/2)<90){hp-=.12;if(hp<=0)over=true}x.fillStyle=q.h===2?'#607d55':'#8b5a4b';x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();x.fillStyle='#b6c98b';x.fillRect(q.x-10,q.y-q.r-13,20,15);x.fillStyle='#111';x.fillRect(q.x-6,q.y-q.r-9,3,3);x.fillRect(q.x+4,q.y-q.r-9,3,3)}z=z.filter(q=>!q.dead&&q.y<H+60);for(let s of shots){x.strokeStyle='#ffd166';x.lineWidth=3;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.tx,s.ty);x.stroke();s.l--}shots=shots.filter(s=>s.l>0);x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(aimX,aimY,18,0,7);x.moveTo(aimX-26,aimY);x.lineTo(aimX+26,aimY);x.moveTo(aimX,aimY-26);x.lineTo(aimX,aimY+26);x.stroke();if(over){x.fillStyle='#000c';x.fillRect(0,0,W,H);x.fillStyle='#d33';x.textAlign='center';x.font='bold 34px system-ui';x.fillText('IL MEZZO È DISTRUTTO',W/2,H/2);x.fillStyle='#fff';x.font='18px system-ui';x.fillText('Zombie eliminati: '+kills,W/2,H/2+40);x.fillText('Tocca per ricominciare',W/2,H/2+75)}drawHud();requestAnimationFrame(loop)}c.addEventListener('click',()=>{if(over){hp=100;kills=0;ammo=30;z=[];over=false}});loop();</script></body></html>
