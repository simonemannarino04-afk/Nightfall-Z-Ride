<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nightfall Z Ride 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020406;font-family:system-ui;color:#fff;touch-action:none}canvas{display:block;touch-action:none}.hud{position:fixed;z-index:8;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 6px #000}.tag{position:fixed;z-index:8;top:43px;width:100%;text-align:center;font-size:11px;letter-spacing:1.5px;color:#bbb}.fire{position:fixed;z-index:12;right:20px;bottom:22px;width:94px;height:94px;border-radius:50%;border:3px solid #fff9;background:#a21717e8;color:#fff;font-size:31px;touch-action:none}.reload{position:fixed;z-index:12;right:35px;bottom:127px;border:1px solid #fff6;background:#111e;color:#fff;padding:11px 15px;border-radius:18px}.help{position:fixed;z-index:8;left:14px;bottom:18px;background:#000a;padding:9px 11px;border-radius:12px;font-size:11px;max-width:190px}.cross{position:fixed;z-index:9;left:50%;top:48%;width:28px;height:28px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 5px #000}.cross:before{left:13px;top:0;width:2px;height:28px}.cross:after{left:0;top:13px;width:28px;height:2px}.flash{position:fixed;z-index:7;inset:0;background:#ffd16a;opacity:0;pointer-events:none}.over{display:none;position:fixed;z-index:20;inset:0;background:#000e;align-items:center;justify-content:center;flex-direction:column;text-align:center}.over h1{color:#d33}.over button{padding:14px 24px;border:0;border-radius:20px;font-weight:800}</style></head><body><div class="hud"><span>🚙 <b id="hp">100</b>%</span><span>💀 <b id="kills">0</b>　🔫 <b id="ammo">30</b>/30</span></div><div class="tag">TIRATORE • INTERNO AUTO</div><div class="cross"></div><div class="flash" id="flash"></div><div class="help">Trascina sulla parte libera dello schermo per mirare • FUOCO spara</div><button class="reload" id="reload">RICARICA</button><button class="fire" id="fire">🔥</button><div class="over" id="over"><h1>IL CONVOGLIO È CADUTO</h1><p>Zombie eliminati: <b id="finalKills">0</b></p><button onclick="location.reload()">RIPROVA</button></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x020407);scene.fog=new THREE.FogExp2(0x020407,.015);const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,300);cam.position.set(.72,1.62,4.45);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x31425a,0x090605,1.45));const dashLight=new THREE.PointLight(0x7da7c7,4,8);dashLight.position.set(0,1.5,3);scene.add(dashLight);const road=new THREE.Mesh(new THREE.PlaneGeometry(18,500),new THREE.MeshStandardMaterial({color:0x151719,roughness:1}));road.rotation.x=-Math.PI/2;road.position.z=-190;scene.add(road);for(let z=-430;z<30;z+=12){const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,4),new THREE.MeshBasicMaterial({color:0x9b8b55}));m.position.set(0,.02,z);scene.add(m)}for(let z=-420;z<20;z+=20){for(const s of[-1,1]){const pole=new THREE.Mesh(new THREE.BoxGeometry(.22,4,.22),new THREE.MeshStandardMaterial({color:0x24282b}));pole.position.set(s*7.4,2,z);scene.add(pole);const li=new THREE.PointLight(0xffad5a,4,13);li.position.set(s*7.1,3.8,z);scene.add(li)}}const interior=new THREE.Group();const dash=new THREE.Mesh(new THREE.BoxGeometry(4.4,.7,1.15),new THREE.MeshStandardMaterial({color:0x15191c,roughness:.75}));dash.position.set(0,1.05,2.55);interior.add(dash);const hood=new THREE.Mesh(new THREE.BoxGeometry(3.5,.25,2.6),new THREE.MeshStandardMaterial({color:0x30363b,metalness:.65}));hood.position.set(0,.8,.8);interior.add(hood);const leftPillar=new THREE.Mesh(new THREE.BoxGeometry(.22,2.8,.28),new THREE.MeshStandardMaterial({color:0x111315}));leftPillar.position.set(-1.75,2.05,2.15);leftPillar.rotation.z=-.08;interior.add(leftPillar);const rightPillar=leftPillar.clone();rightPillar.position.x=1.75;rightPillar.rotation.z=.08;interior.add(rightPillar);const roof=new THREE.Mesh(new THREE.BoxGeometry(4.1,.3,2),new THREE.MeshStandardMaterial({color:0x101214}));roof.position.set(0,3.35,2.1);interior.add(roof);const seat=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.7,.45),new THREE.MeshStandardMaterial({color:0x202225}));seat.position.set(-.85,1.25,4.75);interior.add(seat);scene.add(interior);const gun=new THREE.Group();const gm=new THREE.MeshStandardMaterial({color:0x262a2d,metalness:.8,roughness:.35});const barrel=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,1.65),gm);barrel.position.z=-.72;gun.add(barrel);const receiver=new THREE.Mesh(new THREE.BoxGeometry(.35,.3,.7),gm);receiver.position.z=.08;gun.add(receiver);const grip=new THREE.Mesh(new THREE.BoxGeometry(.24,.62,.3),gm);grip.position.set(0,-.38,.18);grip.rotation.x=-.28;gun.add(grip);gun.position.set(.52,-.55,-1.05);cam.add(gun);scene.add(cam);let hp=100,kills=0,ammo=30,zombies=[],spawnTimer=0,yaw=0,pitch=-.03,activePointer=null,lastX=0,lastY=0,gameOver=false;const clock=new THREE.Clock();const bodyGeo=new THREE.BoxGeometry(.72,1.65,.5),headGeo=new THREE.SphereGeometry(.34,10,8);function spawnZombie(){const g=new THREE.Group();const b=new THREE.Mesh(bodyGeo,new THREE.MeshStandardMaterial({color:Math.random()>.5?0x4e6247:0x64453d}));b.position.y=.9;g.add(b);const h=new THREE.Mesh(headGeo,new THREE.MeshStandardMaterial({color:0x87966d}));h.position.y=2;g.add(h);g.position.set((Math.random()-.5)*13,0,-48-Math.random()*50);g.userData.hp=2;scene.add(g);zombies.push(g)}function hud(){hp=Math.max(0,hp);document.getElementById('hp').textContent=Math.floor(hp);document.getElementById('kills').textContent=kills;document.getElementById('ammo').textContent=ammo}function fireShot(){if(gameOver||ammo<=0)return;ammo--;flash.style.opacity='.13';setTimeout(()=>flash.style.opacity='0',35);gun.position.z=-.88;setTimeout(()=>gun.position.z=-1.05,55);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,.04),cam);const hits=ray.intersectObjects(zombies,true);if(hits.length){let root=hits[0].object;while(root.parent&&root.parent!==scene)root=root.parent;if(root.userData.hp!==undefined){root.userData.hp--;if(root.userData.hp<=0){scene.remove(root);zombies=zombies.filter(z=>z!==root);kills++}}}hud()}fire.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fireShot()});reload.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ammo=30;hud()});renderer.domElement.addEventListener('pointerdown',e=>{if(activePointer!==null)return;activePointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;yaw-=dx*.0032;pitch-=dy*.0027;yaw=Math.max(-1.15,Math.min(1.15,yaw));pitch=Math.max(-.48,Math.min(.48,pitch));lastX=e.clientX;lastY=e.clientY});function endAim(e){if(e.pointerId===activePointer)activePointer=null}renderer.domElement.addEventListener('pointerup',endAim);renderer.domElement.addEventListener('pointercancel',endAim);function animate(){if(gameOver)return;const dt=Math.min(clock.getDelta(),.04);spawnTimer+=dt;if(spawnTimer>1.15){spawnTimer=0;spawnZombie()}cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch;for(const q of zombies){q.position.z+=dt*(6.3+Math.min(kills*.025,3));q.lookAt(0,q.position.y,4);if(q.position.z>2.4){hp-=12;scene.remove(q);q.userData.dead=true}}zombies=zombies.filter(q=>!q.userData.dead);if(hp<=0){gameOver=true;over.style.display='flex';finalKills.textContent=kills;hud();renderer.render(scene,cam);return}hud();renderer.render(scene,cam);requestAnimationFrame(animate)}addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();animate();</script></body></html>
