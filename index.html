<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nightfall Z Ride 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030507;font-family:system-ui;color:#fff;touch-action:none}canvas{display:block}.hud{position:fixed;z-index:4;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 6px #000}.tag{position:fixed;z-index:4;top:44px;width:100%;text-align:center;font-size:12px;letter-spacing:2px;color:#bbb}.fire{position:fixed;z-index:5;right:22px;bottom:24px;width:92px;height:92px;border-radius:50%;border:3px solid #ffffff99;background:#9d1717dd;color:white;font-size:30px}.reload{position:fixed;z-index:5;right:42px;bottom:126px;border:1px solid #ffffff66;background:#111c;color:#fff;padding:10px 14px;border-radius:18px}.help{position:fixed;z-index:4;bottom:18px;left:16px;background:#0009;padding:9px 12px;border-radius:12px;font-size:12px}.cross{position:fixed;z-index:4;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 5px #000}.cross:before{left:12px;top:0;width:2px;height:26px}.cross:after{top:12px;left:0;height:2px;width:26px}.flash{position:fixed;inset:0;pointer-events:none;background:#ffdb7a;opacity:0;z-index:3}.over{display:none;position:fixed;z-index:10;inset:0;background:#000d;align-items:center;justify-content:center;flex-direction:column;text-align:center}.over h1{color:#c33}.over button{padding:14px 24px;border:0;border-radius:20px;font-weight:800}</style></head><body><div class="hud"><span>🚙 <b id="hp">100</b>%</span><span>💀 <b id="kills">0</b>　🔫 <b id="ammo">30</b>/30</span></div><div class="tag">NIGHTFALL Z RIDE • 3D PROTOTYPE</div><div class="cross"></div><div class="flash" id="flash"></div><div class="help">Trascina lo schermo per guardarti intorno</div><button class="reload" id="reload">RICARICA</button><button class="fire" id="fire">🔥</button><div class="over" id="over"><h1>IL CONVOGLIO È CADUTO</h1><p>Zombie eliminati: <b id="finalKills">0</b></p><button onclick="location.reload()">RIPROVA</button></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x020407);scene.fog=new THREE.FogExp2(0x020407,.018);const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);cam.position.set(0,2.1,4);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.6));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);scene.add(new THREE.HemisphereLight(0x23334a,0x090604,1.5));const lamp=new THREE.PointLight(0xffd89a,22,28);lamp.position.set(0,4,2);scene.add(lamp);const road=new THREE.Mesh(new THREE.PlaneGeometry(18,500),new THREE.MeshStandardMaterial({color:0x17191b,roughness:1}));road.rotation.x=-Math.PI/2;road.position.z=-180;scene.add(road);for(let z=-420;z<30;z+=12){const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,4),new THREE.MeshBasicMaterial({color:0xb49c57}));m.position.set(0,.02,z);scene.add(m)}for(let z=-420;z<20;z+=18){for(const side of[-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(.25,4,.25),new THREE.MeshStandardMaterial({color:0x25282a}));p.position.set(side*7.4,2,z);scene.add(p);const l=new THREE.PointLight(0xffb45e,5,13);l.position.set(side*7.1,3.8,z);scene.add(l)}}const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(3,1.1,5),new THREE.MeshStandardMaterial({color:0x30363b,metalness:.7,roughness:.45}));body.position.y=.9;car.add(body);const roof=new THREE.Mesh(new THREE.BoxGeometry(2.5,.8,2.5),new THREE.MeshStandardMaterial({color:0x111820,metalness:.4}));roof.position.set(0,1.65,.2);car.add(roof);car.position.set(0,0,5.5);scene.add(car);const gun=new THREE.Group();const gmat=new THREE.MeshStandardMaterial({color:0x25282b,metalness:.8});const barrel=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,1.7),gmat);barrel.position.z=-.7;gun.add(barrel);const grip=new THREE.Mesh(new THREE.BoxGeometry(.25,.65,.35),gmat);grip.position.set(0,-.35,.05);grip.rotation.x=-.25;gun.add(grip);gun.position.set(.55,-.55,-1.2);cam.add(gun);scene.add(cam);let hp=100,kills=0,ammo=30,zombies=[],clock=new THREE.Clock(),spawnT=0,yaw=0,pitch=-.04,drag=false,lastX=0,lastY=0;const geo=new THREE.BoxGeometry(.75,1.8,.55);const headGeo=new THREE.SphereGeometry(.38,10,8);function spawnZombie(){const g=new THREE.Group(),b=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:Math.random()>.5?0x536449:0x65453d}));b.position.y=1;g.add(b);const h=new THREE.Mesh(headGeo,new THREE.MeshStandardMaterial({color:0x8b9a70}));h.position.y=2.15;g.add(h);g.position.set((Math.random()-.5)*13,0,-55-Math.random()*45);g.userData.hp=2;scene.add(g);zombies.push(g)}function updateHud(){document.getElementById('hp').textContent=Math.max(0,Math.floor(hp));document.getElementById('kills').textContent=kills;document.getElementById('ammo').textContent=ammo}function shoot(){if(ammo<=0)return;ammo--;flash.style.opacity='.2';setTimeout(()=>flash.style.opacity='0',45);gun.position.z=-1;setTimeout(()=>gun.position.z=-1.2,60);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),cam);const hit=ray.intersectObjects(zombies,true)[0];if(hit){let root=hit.object;while(root.parent&&root.parent!==scene)root=root.parent;if(root.userData.hp){root.userData.hp--;if(root.userData.hp<=0){scene.remove(root);zombies=zombies.filter(q=>q!==root);kills++}}}updateHud()}fire.onpointerdown=e=>{e.preventDefault();shoot()};reload.onclick=()=>{ammo=30;updateHud()};r.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.003;pitch=Math.max(-.65,Math.min(.55,pitch));lastX=e.clientX;lastY=e.clientY});function animate(){const dt=Math.min(clock.getDelta(),.04);spawnT+=dt;if(spawnT>1.05){spawnT=0;spawnZombie()}cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch;for(const q of zombies){q.position.z+=dt*(7+Math.min(kills*.03,4));q.lookAt(0,q.position.y,5);if(q.position.z>3){hp-=dt*8;scene.remove(q);q.userData.dead=true}}zombies=zombies.filter(q=>!q.userData.dead);road.position.z+=(dt*8)%12;for(const o of scene.children){if(o!==road&&o.position&&o.position.z<20&&o.geometry&&o.geometry.type==='BoxGeometry'&&Math.abs(o.position.x)<1)o.position.z+=dt*8}if(hp<=0){over.style.display='flex';finalKills.textContent=kills;updateHud();return}updateHud();r.render(scene,cam);requestAnimationFrame(animate)}addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});updateHud();animate();</script></body></html>
