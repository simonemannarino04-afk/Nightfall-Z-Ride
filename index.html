<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nightfall Z Ride</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#0b1520;color:white;font-family:system-ui;touch-action:none}canvas{display:block}.hud{position:fixed;z-index:5;top:9px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 5px #000}.mission{position:fixed;z-index:5;top:39px;width:100%;text-align:center;font-size:12px}.cross{position:fixed;z-index:5;left:50%;top:48%;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:white}.cross:before{left:12px;width:2px;height:26px}.cross:after{top:12px;width:26px;height:2px}.fire{position:fixed;z-index:8;right:18px;bottom:20px;width:92px;height:92px;border-radius:50%;border:3px solid #fff9;background:#a51e1ee8;color:#fff;font-size:29px}.reload,.swap{position:fixed;z-index:8;bottom:124px;padding:11px;border-radius:16px;border:1px solid #fff6;background:#111d;color:white}.reload{right:25px}.swap{right:125px}.msg{position:fixed;z-index:7;left:50%;top:22%;transform:translateX(-50%);font-weight:900;font-size:22px;text-shadow:0 3px 8px #000;opacity:0}.end{display:none;position:fixed;z-index:20;inset:0;background:#06101aee;align-items:center;justify-content:center;flex-direction:column;text-align:center}.end button{padding:14px 24px;border:0;border-radius:18px;font-weight:900}</style></head><body><div class="hud"><span>🚙 <b id="hp">100</b>%　🌊 <b id="wave">1</b>/5</span><span id="weapon">SMG</span>　💀 <b id="kills">0</b>　🔫 <b id="ammo">30</b></div><div class="mission">RAGGIUNGI IL CHECKPOINT • TIRATORE PASSEGGERO</div><div class="cross"></div><div id="msg" class="msg"></div><button id="swap" class="swap">ARMA</button><button id="reload" class="reload">RICARICA</button><button id="fire" class="fire">🔥</button><div id="end" class="end"><h1 id="endTitle"></h1><p id="endText"></p><button onclick="location.reload()">RIGIOCA</button></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const S=new T.Scene();S.background=new T.Color(0x17283a);S.fog=new T.FogExp2(0x17283a,.009);const C=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,350);C.position.set(.7,1.65,4.5);const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.65;document.body.prepend(R.domElement);S.add(new T.HemisphereLight(0xb8d8f4,0x493629,3.5),new T.AmbientLight(0x9fb5c8,1.3));const moon=new T.DirectionalLight(0xd5e8ff,2);moon.position.set(-8,15,-10);S.add(moon);const road=new T.Mesh(new T.PlaneGeometry(18,600),new T.MeshStandardMaterial({color:0x34393d}));road.rotation.x=-Math.PI/2;road.position.z=-260;S.add(road);function box(x,y,z,w,h,d,col){let m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:col,roughness:.8}));m.position.set(x,y,z);S.add(m);return m}for(let z=-500;z<20;z+=13)box(0,.02,z,.12,.03,5,0xe2cb75);for(let z=-450;z<10;z+=28){for(let side of[-1,1]){let x=side*(11+Math.random()*4),h=7+Math.random()*13;box(x,h/2,z,7,h,18,Math.random()>.5?0x4b5157:0x5b514c);for(let yy=3;yy<h;yy+=3)for(let xx=-2;xx<=2;xx+=2){let w=box(x+xx,yy,z+9.01,.7,.8,.05,Math.random()>.45?0xd6a94d:0x27333c);w.material.emissive=new T.Color(w.material.color);w.material.emissiveIntensity=.45}}}for(let z=-400;z<0;z+=35){for(let s of[-1,1]){box(s*7.5,2,z,.2,4,.2,0x555b60);let l=new T.PointLight(0xffc77d,12,22);l.position.set(s*7.2,4,z);S.add(l)}}for(let z=-300;z<-30;z+=75){box((Math.random()-.5)*9,.55,z,2.2,1.1,4,Math.random()>.5?0x6b3131:0x394d63)}const dash=box(0,1.05,2.6,4.4,.72,1.15,0x303940),hood=box(0,.8,.8,3.5,.25,2.6,0x58636b);box(-1.75,2.1,2.1,.23,2.9,.3,0x303438);box(1.75,2.1,2.1,.23,2.9,.3,0x303438);box(0,3.4,2.1,4.1,.3,2,0x282c30);box(-.85,1.25,4.8,1.1,1.7,.45,0x34383c);const head=new T.SpotLight(0xfff0c9,55,100,.5,.5,1);head.position.set(0,1.1,1);head.target.position.set(0,0,-50);S.add(head,head.target);const gun=new T.Group(),gm=new T.MeshStandardMaterial({color:0x41484d,metalness:.75});let gb=new T.Mesh(new T.BoxGeometry(.35,.3,.85),gm);gun.add(gb);let barrel=new T.Mesh(new T.BoxGeometry(.13,.13,1.6),gm);barrel.position.z=-1;gun.add(barrel);gun.position.set(.5,-.55,-1);C.add(gun);S.add(C);const types=[['Civile',2,1,0x758766,1],['Poliziotto',3,.9,0x3b536b,1.03],['Runner',1,1.65,0x895c4c,.88],['Operaio',3,.8,0xb08a3f,1.05],['Brute',7,.52,0x58694e,1.38],['Soldato',4,.75,0x455944,1.08]],weapons=[['SMG',1,30,90],['FUCILE',2,24,170],['SHOTGUN',5,8,600]];let wi=0,hp=100,kills=0,ammo=30,wave=1,zombies=[],spawn=0,spawned=0,target=9,yaw=0,pitch=-.03,pointer=null,lx=0,ly=0,lastShot=0,ended=false;const clock=new T.Clock();function zombie(){let d=types[Math.min(types.length-1,Math.floor(Math.random()*(2+wave)))],g=new T.Group(),mat=new T.MeshStandardMaterial({color:d[3]});let torso=new T.Mesh(new T.BoxGeometry(.72*d[4],1.2*d[4],.5*d[4]),mat);torso.position.y=1.25*d[4];g.add(torso);let h=new T.Mesh(new T.SphereGeometry(.34*d[4],10,8),new T.MeshStandardMaterial({color:0x9aab79}));h.position.y=2.08*d[4];g.add(h);for(let s of[-1,1]){let a=new T.Mesh(new T.BoxGeometry(.18*d[4],1.05*d[4],.18*d[4]),mat);a.position.set(s*.48*d[4],1.25*d[4],0);a.rotation.z=s*.2;g.add(a)}g.position.set((Math.random()-.5)*14,0,-55-Math.random()*55);g.userData={hp:d[1],speed:d[2],name:d[0]};S.add(g);zombies.push(g);spawned++}function hud(){document.getElementById('hp').textContent=Math.max(0,Math.floor(hp));document.getElementById('wave').textContent=wave;document.getElementById('kills').textContent=kills;document.getElementById('ammo').textContent=ammo;document.getElementById('weapon').textContent=weapons[wi][0]}function message(t){msg.textContent=t;msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,1200)}function shoot(){let now=performance.now(),w=weapons[wi];if(ended||ammo<=0||now-lastShot<w[3])return;lastShot=now;ammo--;gun.position.z=-.82;setTimeout(()=>gun.position.z=-1,55);let ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(0,.04),C);let hit=ray.intersectObjects(zombies,true)[0];if(hit){let root=hit.object;while(root.parent&&root.parent!==S)root=root.parent;if(root.userData.hp){root.userData.hp-=w[1];if(root.userData.hp<=0){S.remove(root);zombies=zombies.filter(q=>q!==root);kills++}}}hud()}fire.onpointerdown=e=>{e.preventDefault();e.stopPropagation();shoot()};reload.onpointerdown=e=>{e.stopPropagation();ammo=weapons[wi][2];hud()};swap.onpointerdown=e=>{e.stopPropagation();wi=(wi+1)%weapons.length;ammo=weapons[wi][2];message(weapons[wi][0]);hud()};R.domElement.onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;lx=e.clientX;ly=e.clientY};R.domElement.onpointermove=e=>{if(e.pointerId!==pointer)return;yaw-=(e.clientX-lx)*.0032;pitch-=(e.clientY-ly)*.0027;yaw=Math.max(-1.18,Math.min(1.18,yaw));pitch=Math.max(-.5,Math.min(.5,pitch));lx=e.clientX;ly=e.clientY};onpointerup=e=>{if(e.pointerId===pointer)pointer=null};function finish(win){ended=true;end.style.display='flex';endTitle.textContent=win?'CHECKPOINT RAGGIUNTO':'CONVOGLIO DISTRUTTO';endText.textContent='Zombie eliminati: '+kills+(win?' • Missione completata':'')}function loop(){if(ended)return;let dt=Math.min(clock.getDelta(),.04);spawn+=dt;if(spawn>.8&&spawned<target){spawn=0;zombie()}C.rotation.order='YXZ';C.rotation.y=yaw;C.rotation.x=pitch;for(let q of zombies){q.position.z+=dt*(5.2+wave*.45)*q.userData.speed;q.rotation.z=Math.sin(performance.now()*.006+q.position.x)*.035;if(q.position.z>2.2){hp-=q.userData.name==='Brute'?25:12;S.remove(q);q.userData.dead=1}}zombies=zombies.filter(q=>!q.userData.dead);if(spawned>=target&&zombies.length===0){if(wave>=5)return finish(true);wave++;spawned=0;target=8+wave*3;message('ONDATA '+wave);ammo=weapons[wi][2]}if(hp<=0)return finish(false);hud();R.render(S,C);requestAnimationFrame(loop)}addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});message('ONDATA 1');hud();loop();</script></body></html>
